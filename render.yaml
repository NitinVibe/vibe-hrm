services:
  - type: web
    name: vibe-hrm-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_NAME
        value: Vibe HRM
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_DOCS
        value: "true"
      - key: DB_POOL_CLASS
        value: queue
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLED
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
